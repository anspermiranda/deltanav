[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deltanav"
version = "1.0.0"
description = "What changed in the room? Visibility-aware 3D change detection from two phone videos, with a 3D window, a report and robot maps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ansper Miranda"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "scikit-image>=0.21",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "pillow>=10",
  "imageio-ffmpeg>=0.4.9",
  "fast-simplification>=0.1.7",
  "torch>=2.1",
  "transformers>=4.45",
  "ultralytics>=8.3.150",
  "pycolmap>=4.0",
  "rerun-sdk==0.39.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
deltanav = "deltanav.__main__:main"

[tool.setuptools]
packages = ["deltanav"]

[tool.setuptools.package-data]
deltanav = ["viewer_template.html", "vendor/*"]
